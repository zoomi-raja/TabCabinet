<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Drawer Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Handle Metallic Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Drawer Front Gradient -->
    <linearGradient id="drawerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Tab 1 Gradient (Purple Accent) -->
    <linearGradient id="tab1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Tab 2 Gradient (Cyan Accent) -->
    <linearGradient id="tab2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>

    <!-- Tab 3 Gradient (Blue Accent) -->
    <linearGradient id="tab3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Glow Effect for Tabs -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Background -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" />
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="#475569" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Cabinet Frame -->
  <g filter="url(#dropShadow)">
    <rect x="100" y="100" width="312" height="312" rx="28" fill="url(#frameGrad)" stroke="#475569" stroke-width="4" />
  </g>

  <!-- TOP SECTION: ARCHIVED/STORED TABS (Inside Open Slot) -->
  <g>
    <!-- Dark Interior Cavity -->
    <rect x="116" y="116" width="280" height="130" rx="16" fill="#090D16" />

    <!-- Stored Browser Tabs (Fanning out inside) -->
    <!-- Tab 1 (Back Left - Violet) -->
    <g transform="translate(136, 150)">
      <path d="M0,8 C0,3.58 3.58,0 8,0 L60,0 C64.42,0 68,3.58 68,8 L68,50 L0,50 Z" fill="url(#tab1Grad)" opacity="0.8" />
      <rect x="12" y="16" width="24" height="4" rx="2" fill="#FFFFFF" opacity="0.6" />
    </g>

    <!-- Tab 2 (Middle - Cyan) -->
    <g transform="translate(186, 136)">
      <path d="M0,10 C0,4.48 4.48,0 10,0 L80,0 C85.52,0 90,4.48 90,10 L90,64 L0,64 Z" fill="url(#tab2Grad)" />
      <!-- Close Button / Dot on Tab -->
      <circle cx="74" cy="18" r="4" fill="#FFFFFF" opacity="0.5" />
      <!-- Favicon Placeholder -->
      <circle cx="18" cy="18" r="6" fill="#FFFFFF" opacity="0.8" />
      <!-- Tab Title Line -->
      <rect x="30" y="16" width="30" height="4" rx="2" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- Tab 3 (Front Right - Blue) -->
    <g transform="translate(260, 144)">
      <path d="M0,10 C0,4.48 4.48,0 10,0 L76,0 C81.52,0 86,4.48 86,10 L86,56 L0,56 Z" fill="url(#tab3Grad)" />
      <circle cx="16" cy="18" r="5" fill="#FFFFFF" opacity="0.7" />
      <rect x="28" y="16" width="32" height="4" rx="2" fill="#FFFFFF" opacity="0.8" />
    </g>
  </g>

  <!-- LOWER SECTION: DRAWERS -->
  
  <!-- Drawer 1 (Middle - Partially Pulled Out) -->
  <g filter="url(#dropShadow)">
    <!-- Drawer Face -->
    <rect x="112" y="236" width="288" height="72" rx="14" fill="url(#drawerGrad)" stroke="#64748B" stroke-width="2" />
    <rect x="113" y="237" width="286" height="70" rx="13" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.1" />
    
    <!-- Index Card / Label Holder -->
    <rect x="216" y="250" width="80" height="20" rx="4" fill="#0F172A" stroke="#475569" stroke-width="2" />
    <rect x="228" y="258" width="56" height="4" rx="2" fill="#38BDF8" filter="url(#glow)" />
    
    <!-- Drawer Handle -->
    <path d="M226,282 L286,282 C290,282 292,285 290,288 L284,296 C283,298 280,300 276,300 L236,300 C232,300 229,298 228,296 L222,288 C220,285 222,282 226,282 Z" fill="url(#handleGrad)" />
  </g>

  <!-- Drawer 2 (Bottom - Closed) -->
  <g filter="url(#dropShadow)">
    <!-- Drawer Face -->
    <rect x="116" y="320" width="280" height="76" rx="14" fill="url(#drawerGrad)" stroke="#475569" stroke-width="2" />
    <rect x="117" y="321" width="278" height="74" rx="13" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.05" />
    
    <!-- Index Card / Label Holder -->
    <rect x="220" y="334" width="72" height="18" rx="4" fill="#0F172A" stroke="#334155" stroke-width="2" />
    <rect x="236" y="341" width="40" height="4" rx="2" fill="#64748B" />
    
    <!-- Drawer Handle -->
    <path d="M230,362 L282,362 C285,362 287,364 286,366 L281,373 C280,375 278,376 275,376 L237,376 C234,376 232,375 231,373 L226,366 C225,364 227,362 230,362 Z" fill="url(#handleGrad)" />
  </g>

  <!-- Subtle Cabinet Frame Highlights -->
  <rect x="100" y="100" width="312" height="312" rx="28" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.15" />
</svg>
